services:
  recommendarr:
    # Released images; pin a version (e.g. :0.1) instead of :latest if you prefer.
    image: ghcr.io/mnjongen/recommendarr:latest
    # To build from source instead, comment out the image line and uncomment this:
    # build: .
    container_name: recommendarr
    # Runs as uid 1654 by default; ./config must be writable by it, or pick your own ids:
    # user: "1000:1000"
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
    environment:
      # Required for internet-facing deployments: terminate TLS at a reverse proxy,
      # then set both values to the public hostname.
      # AllowedHosts: recommendarr.example.com
      # Recommendarr__Web__PublicUrl: https://recommendarr.example.com
      # History source: Tautulli or Plex
      Recommendarr__History__Provider: Tautulli
      Recommendarr__Tautulli__BaseUrl: http://tautulli:8181
      Recommendarr__Tautulli__ApiKey: changeme
      Recommendarr__Plex__BaseUrl: http://plex:32400
      Recommendarr__Plex__Token: changeme
      # How often to sync history and TMDB metadata (hh:mm:ss)
      # Recommendarr__Sync__Interval: "06:00:00"
      # TMDB API Read Access Token (v4)
      Recommendarr__Tmdb__ApiKey: changeme
      Recommendarr__Seerr__BaseUrl: http://seerr:5055
      Recommendarr__Seerr__ApiKey: changeme
      # Embeddings: Onnx (built in), Ollama, or OpenAI
      Recommendarr__Embeddings__Provider: Onnx
      # Recommendarr__Embeddings__Endpoint: http://ollama:11434
      # Recommendarr__Embeddings__Model: nomic-embed-text
      # Optional LLM re-ranking
      Recommendarr__Llm__Enabled: "false"
      # Recommendarr__Telegram__BotToken: changeme
      # Recommendarr__Discord__BotToken: changeme
    restart: unless-stopped

  # Optional: local models for embeddings and/or LLM re-ranking.
  # ollama:
  #   image: ollama/ollama
  #   volumes:
  #     - ./ollama:/root/.ollama
  #   restart: unless-stopped
